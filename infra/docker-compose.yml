services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quantlab
      POSTGRES_PASSWORD: quantlab_local_only
      POSTGRES_DB: quantlab_dev
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab -d quantlab_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
