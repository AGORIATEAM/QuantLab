[project]
name = "quantlab"
version = "0.1.0"
description = "QuantLab — quantitative research platform (Phase 0: Foundation)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1,<4",
    "uuid6>=2024.1.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = ["docs"]
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["quantlab"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a local PostgreSQL (make db-up); auto-skipped when unreachable",
]
